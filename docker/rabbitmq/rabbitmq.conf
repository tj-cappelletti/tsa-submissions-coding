# Connection settings
# Increase timeout for local development
consumer_timeout = 1800000

# Disk persistence
disk_free_limit.absolute = 2GB

# Heartbeat (helps detect dead connections)
heartbeat = 60

# Logging
log.console = true
log.console.level = info

# Management plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Enable quorum queue features
raft.wal_max_size_bytes = 512000000  # 512MB WAL files

# Memory settings (adjust based on your local machine)
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.75
